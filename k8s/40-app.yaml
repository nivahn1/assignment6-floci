# The app Deployment runs the bundled frontend and backend.
# Its image now comes from Floci's emulated ECR registry (the same pattern you
# will use with real ECR on AWS), instead of being built inside minikube.
# The ClusterIP Service gives the app a stable in-cluster address; you reach it
# from your laptop with `kubectl port-forward` (see the README).
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: todo-app
spec:
  # minikube used NodePort + `minikube service`. The Floci k3s node does not
  # publish NodePorts to your laptop, so ClusterIP + port-forward is simpler.
  # On real EKS later, this becomes `type: LoadBalancer`.
  type: ClusterIP
  selector:
    app: todo-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: app
          # <account>.dkr.ecr.<region>.<host>/<repository>:<tag>
          # Floci's default account is 000000000000. The cluster is configured
          # with a registry mirror, so this same name works for `docker push`
          # on your laptop AND for the pull inside the cluster.
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/todo-app:v1
          # Pull from ECR the first time; reuse the cached copy after that.
          # (minikube used `Never` because the image was built inside it.)
          # Bump the tag (v2, v3, ...) when you push a new build.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MYSQL_HOST
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MYSQL_USER
            - name: MYSQL_DB
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MYSQL_DB
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-mysql-secret
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/greeting
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/greeting
              port: http
            periodSeconds: 10
            failureThreshold: 3
